{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>Task Manager</title>
    <link rel="stylesheet" href="{% static 'tasks/css/style.css' %}">
</head>
<body>
<div class="container">
    <h1>Task Manager</h1>
    <a href="{% url 'add_task' %}" class="add-btn">+ Add Task</a>

    <ul class="task-list">
        {% for task in tasks %}
        <li class="task-item {% if task.status == 'completed' %}completed{% endif %}">
            <span>
                <strong>{{ task.title }}</strong>: {{ task.description }}
            </span>
            <div class="buttons">
                {% if task.status == 'pending' %}
                    <a href="{% url 'mark_completed' task.id %}" class="btn complete">Mark Completed</a>
                {% else %}
                    <a href="{% url 'mark_pending' task.id %}" class="btn pending">Mark Pending</a>
                {% endif %}
                <a href="{% url 'delete_task' task.id %}" class="btn delete">Delete</a>
            </div>
        </li>
        {% empty %}
        <li>No tasks yet.</li>
        {% endfor %}
    </ul>
</div>
</body>
</html>
